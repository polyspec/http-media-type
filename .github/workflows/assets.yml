# The assets of each platform of the bindings of http-media-type (binding GN-19a, GN-19i). The workflow ci calls it for the
# commit of its run, and the workflow release calls it for the tree of the tag that it releases, with release true, which
# runs the release check of binding before a job builds (make release-binding-check).
#
# The jobs platform and php run on the runner of their platform, ubuntu-26.04, ubuntu-26.04-arm or macos-15, the one exception to the
# runner rule of AGENTS.md: the asset of a platform is built and loaded only on that platform, because no tool of the
# release compiles for another platform (tests/scripts/workflows.test.mts checks each combination). Each job is one recipe
# of the Makefile, which its one run step calls (AGENTS.md, "CI and release"): make ci-platform, make ci-php
# EXPECTED_PHP_MINOR=<minor> and make ci-npm, each with RELEASE, the input release. Each recipe installs the tools, writes
# the release recipes of the contract with the binding of package.json (make release-recipes, packages/release.mk) and
# builds: ci-platform the static library of the Go module, the abi3 wheel and the npm platform package once per platform,
# each to its end; ci-php one extension per platform/minor combination with the PHP that setup-php selects for the entry;
# ci-npm the npm package itself with the wasm-bindgen of mise.toml. Every other step is a uses step: the checkout, the
# bootstrap, setup-php and the upload of var/release/assets as an artifact, which the workflow release downloads.
name: assets

on:
  workflow_call:
    inputs:
      ref:
        description: The tag whose tree the jobs build; empty builds the commit of the calling run
        required: false
        type: string
        default: ''
      release:
        description: Whether each job runs the release check of binding before it builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # The tree of the tag, or of the commit of the calling run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      - run: make ci-platform RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-${{ matrix.platform }}
          path: var/release/assets/
          if-no-files-found: error

  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.4'
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.5'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.4'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.5'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.4'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.5'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      # Each entry owns one native PHP selection and one distinctly named asset.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - run: make ci-php EXPECTED_PHP_MINOR=${{ matrix.php }} RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-php-${{ matrix.platform }}-${{ matrix.php }}
          path: var/release/assets/
          if-no-files-found: error

  npm:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      - run: make ci-npm RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-npm
          path: var/release/assets/
          if-no-files-found: error
