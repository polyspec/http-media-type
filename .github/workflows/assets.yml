# The assets of each platform of the bindings of http-media-type (binding GN-19a, GN-19i). The workflow ci calls it for the
# commit of its run, and the workflow release calls it for the tree of the tag that it releases, with release true, which
# runs the release check of binding before a job builds (make release-binding-check).
#
# The jobs platform and php run on the runner of their platform, ubuntu-26.04, ubuntu-26.04-arm or macos-15, the one exception to the
# runner rule of AGENTS.md: the asset of a platform is built and loaded only on that platform, because no tool of the
# release compiles for another platform (tests/scripts/workflows.test.mts checks each combination). Each job writes the
# release recipes of the contract with the binding of package.json (make release-recipes, packages/release.mk), then builds
# the static library of the Go module, the abi3 wheel and the npm platform package once per platform. The separate php
# job builds one extension per platform/minor combination; the job npm packs the npm package itself with the wasm-bindgen of mise.toml. Each uploads
# var/release/assets as an artifact, which the workflow release downloads. Each run step is one make target, and the build
# steps after the first also run after a failed one, so one run names every asset that does not build.
name: assets

on:
  workflow_call:
    inputs:
      ref:
        description: The tag whose tree the jobs build; empty builds the commit of the calling run
        required: false
        type: string
        default: ''
      release:
        description: Whether each job runs the release check of binding before it builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # The tree of the tag, or of the commit of the calling run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      # The Rust toolchain of rust-toolchain.toml with llvm-tools and the musl targets, and the uv and the Python of
      # mise.toml, with which uv builds the wheel.
      - name: install Rust, uv and Python
        run: make install-tools TOOLS="rust uv python"
      # The crates of Cargo.lock, which binding generate reads offline.
      - name: fetch the locked crates
        run: make install-binding
      - name: write the release recipes
        run: make release-recipes
      - name: run the release check of binding
        if: ${{ inputs.release }}
        run: make release-binding-check
      - name: build the static library of the Go module
        run: make release-go-static
      - name: build the wheel
        if: ${{ !cancelled() }}
        run: make release-wheel
      - name: build the npm platform package
        if: ${{ !cancelled() }}
        run: make release-npm-platform
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-${{ matrix.platform }}
          path: var/release/assets/
          if-no-files-found: error

  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.4'
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.5'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.4'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.5'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.4'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.5'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
        if: ${{ !cancelled() }}
      - name: install Rust
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=rust
      - name: fetch the locked crates
        if: ${{ !cancelled() }}
        run: make install-binding
      - name: write the release recipes
        if: ${{ !cancelled() }}
        run: make release-recipes
      - name: run the release check of binding
        if: ${{ !cancelled() && inputs.release }}
        run: make release-binding-check
      - name: install the LLVM of config/toolchain.json
        if: ${{ !cancelled() }}
        run: make install-llvm
      # Each entry owns one native PHP selection and one distinctly named asset.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: ${{ !cancelled() }}
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: build the PHP extension
        if: ${{ !cancelled() }}
        run: make release-php-ext PHP=php EXPECTED_PHP_MINOR=${{ matrix.php }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-php-${{ matrix.platform }}-${{ matrix.php }}
          path: var/release/assets/
          if-no-files-found: error

  npm:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      # The Rust toolchain of rust-toolchain.toml with the target wasm32-unknown-unknown.
      - name: install Rust
        run: make install-tools TOOLS=rust
      - name: fetch the locked crates
        run: make install-binding
      - name: write the release recipes
        run: make release-recipes
      - name: install the wasm-bindgen of mise.toml
        run: make install-wasm-bindgen
      - name: run the release check of binding
        if: ${{ inputs.release }}
        run: make release-binding-check
      - name: pack the npm package
        run: make release-npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-npm
          path: var/release/assets/
          if-no-files-found: error
