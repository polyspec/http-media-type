# The checks of http-media-type on GitHub: the push of main and every manual run (workflow_dispatch) run one job per entry of the
# matrix of the job check, and each entry runs `make ci-check NAME=<name>`, whose recipe holds the installs and the targets
# of the entry. The entries together run every target of `make check` and `make test-bindings`, each once, and `make
# release-coverage`. A failure never stops the run: the matrix does not cancel the other entries (fail-fast: false), and
# the recipe runs every target to its end. Each matrix job writes the job summary and uploads its report var/ci/<name>/:
# the status, the first failure lines and the full log of each target. The last job, ci-passed, passes only when every
# other job of this workflow passed; a release takes the id of such a run and tags its commit (.github/workflows/release.yml).
# The job assets calls .github/workflows/assets.yml, which builds the assets of each platform of the bindings as a release
# does.
#
# Every job is one recipe of the Makefile (AGENTS.md, "CI and release"): its one run step is `make ci-<job>` with make
# variables alone, and every other step is a `uses:` step that provisions the runner or carries a result: the checkout,
# the bootstrap (uses: ./.github/actions/bootstrap), the PHP of .php-version, which setup-php provides and make
# install-tools wraps in var/tools/bin, and the upload of the report. A local run is the same call, make ci-check NAME=core.
# The jobs run on ubuntu-26.04-arm but for the platform runners of assets.yml, the actions are pinned by commit and no step
# has a time limit. No job waits for another job or reads its build output.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          # The installs and the targets of each entry are CI_CHECK_INSTALLS_<name> and CI_CHECK_TARGETS_<name> of the
          # Makefile.
          - name: core
          - name: bindings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, which make install-tools wraps in var/tools/bin; every entry
      # installs every tool of the checkout, so every entry sets it up.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - run: make ci-check NAME=${{ matrix.name }}
      # The report of the entry, also after a failed check.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ci-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci/${{ matrix.name }}/
          if-no-files-found: error
  # The assets of each platform of the bindings, built from the commit of the run with the matrix of the release (binding
  # GN-19a, GN-19i), so that an asset that does not build stops the release before a tag exists.
  assets:
    uses: ./.github/workflows/assets.yml
  # The job that fails the run when any other job did not pass, so a release, which takes a successful run by its id,
  # holds every job. It runs after every other job, also after a failed, skipped or cancelled one (if: always()), and
  # make ci-passed fails unless every job of needs has the result success. The job exists only in CI, since it judges the
  # results of the other jobs, which its run step passes as the JSON of needs.
  ci-passed:
    if: ${{ always() }}
    needs: [check, assets]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap
      - run: make ci-passed RESULTS='${{ toJSON(needs) }}'
