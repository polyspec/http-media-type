# The release of http-media-type. It starts by itself when a push run of the workflow ci succeeds on main: it checks out the
# head_sha of that run, and release-tag with AUTO=1 releases the top section ## X.Y.Z of CHANGELOG.md at that commit when
# it is the version commit of that version. A dispatch with the id of a successful CI run releases the commit of that run.
# The run of ci is the evidence; the release runs no test again. Its jobs:
#   tag      make ci-tag: release-tag tags the commit with vX.Y.Z and release-tag-output gives the tag and the version to
#            the later jobs; both are empty when the run releases nothing, and the later jobs are then skipped
#   assets   assets.yml builds the assets of each platform from the tree of the tag, after the release check of binding
#            (binding GN-19i)
#   release  on the tree of the tag, after the download of the assets of each platform into var/release/platform-assets,
#            make ci-release: installs the tools of config/release.json, builds its archives, creates the GitHub Release
#            of the tag as a draft, adds the assets of each platform, carries the Go module with its tag
#            packages/go/vX.Y.Z (release-go-module, binding GN-19f), uploads the assets of each platform
#            (release-platform-assets, binding GN-19g) and makes the release public
# A failed step leaves the release a draft and fails the run. Each job is one recipe of the Makefile, which its one run
# step calls (AGENTS.md, "CI and release"); the values of the event and of the run reach the recipe through the env of
# the job. The recipe runs the targets of the Makefile and of the release recipes that it includes (packages/release.mk,
# which make release-recipes writes); the jobs
# run on ubuntu-26.04-arm but for the platform runners of assets.yml, the actions are pinned by commit and no step has a
# time limit.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run whose exact commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of ci alone. The concurrency group is the
    # job's, so one release of the repository runs at a time.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    # The values of the event and of the run, which make ci-tag reads from its environment.
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      EVENT: ${{ github.event_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history, so origin/main is there for the ancestry check of release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/bootstrap
      - id: tag
        run: make ci-tag

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release: true

  release:
    needs: [tag, assets]
    if: ${{ needs.tag.outputs.tag != '' }}
    concurrency:
      group: release-${{ github.repository }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    # The tag and the version of the job tag and the actor of the run, which make ci-release reads from its environment.
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
      ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The tree of the tag with the whole history, on which release-go-module makes the commit of the Go module.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, with which Composer archives the package of the PHP
      # extension.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      # actions/download-artifact v8.0.2: the assets of each platform that the job assets built, merged into
      # var/release/platform-assets; make ci-release adds them to var/release/assets after it created the draft release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          path: var/release/platform-assets
          merge-multiple: true
      - run: make ci-release
