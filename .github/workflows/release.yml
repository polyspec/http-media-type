# The release of http-media-type. It starts by itself when a push run of the workflow ci succeeds on main: it checks out the
# head_sha of that run, and release-tag with AUTO=1 releases the top section ## X.Y.Z of CHANGELOG.md at that commit when
# it is the version commit of that version. A dispatch with the id of a successful CI run releases the commit of that run.
# The run of ci is the evidence; the release runs no test again. Its jobs:
#   tag      release-tag tags the commit with vX.Y.Z and release-tag-output gives the tag and the version to the later jobs;
#            both are empty when the run releases nothing, and the later jobs are then skipped
#   assets   assets.yml builds the assets of each platform from the tree of the tag, after the release check of binding
#            (binding GN-19i)
#   release  on the tree of the tag: installs the tools of config/release.json, builds its archives, creates the GitHub
#            Release of the tag as a draft, downloads the assets of each platform, carries the Go module with its tag
#            packages/go/vX.Y.Z (release-go-module, binding GN-19f), uploads the assets of each platform
#            (release-platform-assets, binding GN-19g) and makes the release public
# A failed step leaves the release a draft and fails the run. Every step that runs a command runs one make target, of the
# Makefile or of the release recipes that it includes (packages/release.mk, which make release-recipes writes); the jobs
# run on ubuntu-26.04-arm but for the platform runners of assets.yml, the actions are pinned by commit and no step has a
# time limit.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run whose exact commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of ci alone. The concurrency group is the
    # job's, so one release of the repository runs at a time.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history, so origin/main is there for the ancestry check of release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/bootstrap
      - name: tag the commit of the CI run
        run: make release-tag ${{ github.event_name == 'workflow_run' && 'AUTO=1' || '' }}
      - id: tag
        name: give the tag to the later jobs
        run: make release-tag-output

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release: true

  release:
    needs: [tag, assets]
    if: ${{ needs.tag.outputs.tag != '' }}
    concurrency:
      group: release-${{ github.repository }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The tree of the tag with the whole history, on which release-go-module makes the commit of the Go module.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, with which Composer archives the package of the PHP
      # extension.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      - name: prepare the release
        run: make release-prepare
      - name: install the tools of the release
        run: make release-tools
      - name: put the installed tools on PATH
        run: make release-tools-path
      - name: build the archives
        run: make release-assets
      - name: create the draft release
        run: make release-publish
      # actions/download-artifact v8.0.2: the assets of each platform that the job assets built, merged into
      # var/release/assets.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          path: var/release/assets
          merge-multiple: true
      # The Rust toolchain, whose llvm-nm and llvm-size check the libraries, and the Go of mise.toml, with which a consumer
      # proves the commit of the Go module; the crates of Cargo.lock, which binding generate reads offline.
      - name: install Rust and Go
        run: make install-tools TOOLS="rust go"
      - name: fetch the locked crates
        run: make install-binding
      - name: write the release recipes
        run: make release-recipes
      # binding makes the commit of the Go module with the identity of the Git of the run, which is the actor of the run.
      - name: carry the Go module of the tag
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: make release-go-module
      - name: upload the assets of each platform
        run: make release-platform-assets
      - name: make the release public
        run: make release-undraft
