[package]
name = "polyspec-http-media-type"
description = "Media types of HTTP: their reader, their writer, the comparison of parameter values and their grammar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_http_media_type"
path = "src/lib.rs"

[dependencies]
# The kind interface that the generated bindings read from the core error (bindgen design E-1, E-3, I-2 (3)). The Git
# source is the bindgen repository on the branch that every repository uses; Cargo.lock pins its commit, the same
# bindgen_core as the generated binding crates.
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", branch = "v1/rust-core" }

[dev-dependencies]
serde_json = "1"
proptest = "1"

[lints]
workspace = true
