[package]
name = "polyspec-http-media-type"
description = "Media types of HTTP: their reader, their writer, the comparison of parameter values and their grammar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_http_media_type"
path = "src/lib.rs"

[dev-dependencies]
serde_json = "1"
proptest = "1"

[lints]
workspace = true
