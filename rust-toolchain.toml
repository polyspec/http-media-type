[toolchain]
channel = "1.99.0"
profile = "minimal"
# clippy is the lint of make lint-rust and make lint-bindings. llvm-tools holds the llvm-strip that make release-go-static
# runs from the toolchain of the checkout, never from PATH (binding GN-19b).
components = ["rustfmt", "clippy", "llvm-tools"]
# The WASM binding is built for wasm32-unknown-unknown (binding GN-18); the musl targets are those of the Go libraries
# that make release-go-static builds on a Linux host (binding GN-19b, GN-19h). The install of the toolchain installs
# them, so a job that builds these needs no step of its own.
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
