# One workspace: the core crate and the binding crates that binding scaffold writes (binding design L-2). One Cargo.lock
# at the root pins every dependency of all of them, the commit of polyspec-binding-core included.
[workspace]
resolver = "2"
members = ["packages/rust", "packages/python", "packages/ts", "packages/ts/wasm", "packages/php-ext", "packages/go/internal/ffi"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.99.0"
repository = "https://github.com/polyspec/http-media-type.git"

# Every warning fails; no unsafe code; no hidden error (P-3: no value stands in for a failure), and every allow
# attribute names the rule that needs it. clippy.toml disallows the methods that turn a failure or an absence into a
# value.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
as_conversions = "deny"

# The release profile builds every package of a release, the Go static library among them, and Cargo sets lto for a
# whole profile and not for one package. LTO would put the standard library and binding_core into the one object of the
# Go static library, and a Go program that links it beside the static library of another polyspec repository would
# fail with duplicate symbols such as rust_eh_personality (binding GN-15i, CK-91). So no package takes LTO, and
# codegen-units = 1 keeps the optimization across the units of each crate.
[profile.release]
lto = false
codegen-units = 1
